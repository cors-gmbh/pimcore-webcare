version: '3.4'

networks:
  cors_dev:
    external: true

services:
  db:
      image: mysql:8
      container_name: cors-webcare
      networks:
        - cors_dev
      working_dir: /application
      volumes:
        - webcare-database:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=ROOT
        - MYSQL_DATABASE=pimcore
        - MYSQL_USER=pimcore
        - MYSQL_PASSWORD=pimcore

  nginx:
    image: nginx:stable-alpine
    container_name: webcare_database-nginx
    labels:
      - traefik.enable=true
      - traefik.http.routers.webcare_database.rule=Host(`cors-webcare.localhost`)
      - traefik.http.routers.webcare_database.entrypoints=cors_dev
      - traefik.http.routers.webcare_database.tls=true
      - traefik.http.services.webcare_database.loadbalancer.server.port=80
      - traefik.docker.network=cors_dev
    networks:
      - cors_dev
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: ghcr.io/cors-gmbh/pimcore-docker/php-fpm:8.3-alpine3.22-8.0-latest
    container_name: php-cors-webcare
    command: 'php-fpm'
    entrypoint: docker-php-entrypoint
    networks:
      - cors_dev
    depends_on:
      - db
    volumes:
      - ./:/var/www/html:cached
      - ./.docker/php.ini:/usr/local/etc/php/conf.d/docker-php-ext-additional.ini:ro
    environment:
      - COMPOSER_AUTH=${COMPOSER_AUTH}

volumes:
  webcare-database:
